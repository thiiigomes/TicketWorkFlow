{% extends "layouts/app.html" %}

{% block title %}
Novo Chamado
{% endblock %}

{% block content %}

<div class="container-fluid">

    <!-- Cabeçalho -->
    <div class="d-flex flex-column flex-md-row
                justify-content-between align-items-md-center
                gap-3 mb-4">

        <div>
            <h2 class="fw-bold mb-1">
                <i class="bi bi-plus-circle me-2 text-primary"></i>
                Novo Chamado
            </h2>

            <p class="text-muted mb-0">
                Preencha as informações abaixo para registrar um novo chamado.
            </p>
        </div>

        <a href="{{ url_for('chamados.chamados') }}"
           class="btn btn-outline-secondary">

            <i class="bi bi-arrow-left me-1"></i>
            Voltar

        </a>

    </div>


    <!-- Formulário -->
    <div class="card shadow-sm border-0">

        <div class="card-body p-4">

            <form method="POST">

                <!-- Título -->
                <div class="mb-4">

                    <label for="titulo"
                           class="form-label fw-semibold">

                        <i class="bi bi-type me-1 text-muted"></i>
                        Título

                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="titulo"
                        name="titulo"
                        maxlength="150"
                        placeholder="Ex.: Computador não inicia"
                        required>

                    <div class="form-text">
                        Informe resumidamente o problema encontrado.
                    </div>

                </div>


                <!-- Descrição -->
                <div class="mb-4">

                    <label for="descricao"
                           class="form-label fw-semibold">

                        <i class="bi bi-card-text me-1 text-muted"></i>
                        Descrição

                    </label>

                    <textarea
                        class="form-control"
                        id="descricao"
                        name="descricao"
                        rows="5"
                        placeholder="Descreva o problema com o máximo de detalhes possível..."
                        required></textarea>

                </div>


                <!-- Categoria e Prioridade -->
                <div class="row g-3 mb-4">

                    <div class="col-md-6">

                        <label for="categoria_id"
                               class="form-label fw-semibold">

                            <i class="bi bi-tag me-1 text-muted"></i>
                            Categoria

                        </label>

                        <select
                            class="form-select"
                            id="categoria_id"
                            name="categoria_id"
                            required>

                            <option value="" selected disabled>
                                Selecione uma categoria
                            </option>

                            {% for categoria in categorias %}

                                <option value="{{ categoria.id }}">
                                    {{ categoria.nome }}
                                </option>

                            {% endfor %}

                        </select>

                    </div>


                    <div class="col-md-6">

                        <label for="prioridade_id"
                               class="form-label fw-semibold">

                            <i class="bi bi-exclamation-circle me-1 text-muted"></i>
                            Prioridade

                        </label>

                        <select
                            class="form-select"
                            id="prioridade_id"
                            name="prioridade_id"
                            required>

                            <option value="" selected disabled>
                                Selecione uma prioridade
                            </option>

                            {% for prioridade in prioridades %}

                                <option value="{{ prioridade.id }}">
                                    {{ prioridade.nome }}
                                </option>

                            {% endfor %}

                        </select>

                    </div>

                </div>


                <!-- Equipamento e Técnico -->
                <div class="row g-3">

                    <div class="col-md-6">

                        <label for="equipamento_id"
                               class="form-label fw-semibold">

                            <i class="bi bi-laptop me-1 text-muted"></i>
                            Equipamento

                        </label>

                        <select
                            class="form-select"
                            id="equipamento_id"
                            name="equipamento_id"
                            required>

                            <option value="" selected disabled>
                                Selecione um equipamento
                            </option>

                            {% for equipamento in equipamentos %}

                                <option value="{{ equipamento.id }}">
                                    {{ equipamento.nome }}
                                </option>

                            {% endfor %}

                        </select>

                    </div>


                    <div class="col-md-6">

                        <label for="tecnico_id"
                               class="form-label fw-semibold">

                            <i class="bi bi-person-gear me-1 text-muted"></i>
                            Técnico responsável

                        </label>

                        <select
                            class="form-select"
                            id="tecnico_id"
                            name="tecnico_id"
                            required>

                            <option value="" selected disabled>
                                Selecione um técnico
                            </option>

                            {% for tecnico in tecnicos %}

                                <option value="{{ tecnico.id }}">
                                    {{ tecnico.nome }}
                                </option>

                            {% endfor %}

                        </select>

                    </div>

                </div>


                <!-- Ações -->
                <div class="d-flex flex-column flex-sm-row
                            justify-content-end gap-2
                            mt-4 pt-4 border-top">

                    <a href="{{ url_for('chamados.chamados') }}"
                       class="btn btn-outline-secondary">

                        Cancelar

                    </a>

                    <button type="submit"
                            class="btn btn-primary">

                        <i class="bi bi-check-circle me-1"></i>
                        Criar Chamado

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
