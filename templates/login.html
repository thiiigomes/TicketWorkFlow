{% extends 'base.html' %}

{% block title %}
Login
{% endblock %}

{% block content %}

<div class="login-container">

    <div class="login-card">

        <h1>Ticket Workflow</h1>

        <p>
            Sistema de Gerenciamento de Chamados
        </p>

        {% if erro %}
            <p class="erro">{{ erro }}</p>
        {% endif %}

        <form method="POST">

            <input
                type="email"
                name="email"
                placeholder="E-mail"
                required
            >

            <input
                type="password"
                name="senha"
                placeholder="senha"
                required
            >

            <button type="submit">

                Entrar

            </button>

        </form>

    </div>

</div>

{% endblock %}
